name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  verify:
    name: Verify on macOS
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate macOS release configuration
        shell: bash
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const mac = pkg.build && pkg.build.mac;
          const targets = Array.isArray(mac && mac.target) ? mac.target : [];
          const targetNames = new Set(targets.map(item => item && item.target));

          if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) {
            throw new Error(`Invalid package version: ${pkg.version}`);
          }
          if (process.env.GITHUB_REF_TYPE === 'tag' &&
              process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error(
              `Tag ${process.env.GITHUB_REF_NAME} does not match package version v${pkg.version}`
            );
          }
          if (!mac || mac.identity !== '-' ||
              mac.hardenedRuntime !== false || mac.notarize !== false) {
            throw new Error(
              'macOS builds must use ad-hoc signing without hardened runtime or notarization'
            );
          }
          if (!targetNames.has('dmg') || !targetNames.has('zip')) {
            throw new Error('macOS build targets must include both DMG and ZIP');
          }
          if (!String(mac.artifactName || '').includes('${arch}')) {
            throw new Error('macOS artifactName must include ${arch}');
          }
          NODE

      - name: Run project checks
        run: npm run check:all

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build macOS (${{ matrix.arch }})
    needs: verify
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            macho_arch: x86_64
          - arch: arm64
            macho_arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build DMG and ZIP
        shell: bash
        env:
          OUTPUT_DIR: dist-macos-${{ matrix.arch }}
        run: |
          node node_modules/electron-builder/cli.js \
            --mac dmg zip \
            --${{ matrix.arch }} \
            --publish never \
            --config.directories.output="$OUTPUT_DIR"

      - name: Verify application and artifacts
        shell: bash
        env:
          OUTPUT_DIR: dist-macos-${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
          MACHO_ARCH: ${{ matrix.macho_arch }}
        run: |
          app_path="$(find "$OUTPUT_DIR" -type d -path '*/Mineradio.app' -print -quit)"
          app_binary="$app_path/Contents/MacOS/Mineradio"
          test -d "$app_path"
          test -f "$app_binary"

          actual_arch="$(lipo -archs "$app_binary")"
          test "$actual_arch" = "$MACHO_ARCH"
          file "$app_binary"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature_details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_details"
          grep -q 'Signature=adhoc' <<<"$signature_details"

          dmg=("$OUTPUT_DIR"/Mineradio-*-"$TARGET_ARCH".dmg)
          zip=("$OUTPUT_DIR"/Mineradio-*-"$TARGET_ARCH".zip)
          test -f "${dmg[0]}"
          test -f "${zip[0]}"
          test "${#dmg[@]}" -eq 1
          test "${#zip[@]}" -eq 1

          shasum -a 256 "${dmg[0]}" "${zip[0]}" \
            | sed "s#${OUTPUT_DIR}/##" \
            > "$OUTPUT_DIR/SHA256SUMS-$TARGET_ARCH.txt"

      - name: Upload architecture-specific artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mineradio-macOS-${{ matrix.arch }}
          path: |
            dist-macos-${{ matrix.arch }}/Mineradio-*-${{ matrix.arch }}.dmg
            dist-macos-${{ matrix.arch }}/Mineradio-*-${{ matrix.arch }}.zip
            dist-macos-${{ matrix.arch }}/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30
